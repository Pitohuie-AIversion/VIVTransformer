# Iso-Latency 等时延对比配置
# 目标: 在相近的推理延迟约束下公平对比不同模型架构
# 最贴近工程应用场景的对比方式

# 数据配置 (统一)
data:
  data_path: "x:/2025/Graduation_project/Pdebench_input_Transformer/VIVTransformer-1/generate_data/preprocessed_data/darcy_flow_input32_output128_dataset.h5"
  input_dim: 1024    # 32x32输入
  output_dim: 16384  # 128x128输出
  crop_mode: "center"
  output_resolution: [128, 128]
  output_channels: 1
  batch_size: 1      # 单样本推理，更真实的延迟测量
  val_split: 0.2
  test_split: 0.1
  max_samples: 1000
  preprocessing:
    normalize: true
    remove_channel_dim: true

# 训练配置 (统一)
training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  min_delta: 0.0001
  optimizer: "adam"
  scheduler: "cosine"
  mixed_precision: true  # 启用混合精度以提升推理速度

# 损失配置 (统一)
loss:
  mse_only: true
  mse_weight: 1.0

# 硬件配置 (统一)
hardware:
  device: "cuda"
  benchmark_mode: true  # 启用cudnn benchmark
  deterministic: false  # 关闭确定性以提升速度

# === Iso-Latency 模型组 ===
# 通过调整模型复杂度使推理延迟接近目标值

models:
  # === 快速推理组 (~5ms) ===
  # 适用于实时应用场景
  
  # 超轻量MLP - 目标5ms
  ultra_light_mlp:
    model_type: mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [128, 128]  # 极小隐藏层
    activation: relu         # 更快的激活函数
    dropout: 0.0            # 关闭dropout提升速度
    use_batch_norm: false   # 关闭BN提升速度
    target_latency_ms: 5.0
    
  # 超轻量Transformer - 目标5ms
  ultra_light_transformer:
    model_type: transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 64
    num_heads: 1            # 单头注意力
    num_layers: 1           # 单层
    dropout: 0.0
    seq_len: 11
    pe_type: sinusoidal_1d  # 更快的位置编码
    target_latency_ms: 5.0

  # === 标准推理组 (~10ms) ===
  # 平衡性能与速度
  
  # 轻量MLP - 目标10ms
  light_mlp:
    model_type: mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [256, 256, 128]
    activation: gelu
    dropout: 0.1
    use_batch_norm: true
    target_latency_ms: 10.0
    
  # 轻量Transformer - 目标10ms
  light_transformer:
    model_type: transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 128
    num_heads: 2
    num_layers: 2
    dropout: 0.1
    seq_len: 11
    pe_type: sinusoidal_1d
    target_latency_ms: 10.0
    
  # 优化CustomTransformer - 目标10ms
  optimized_custom_transformer:
    model_type: custom_transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 32
    num_heads: 2
    num_layers: 1
    dropout: 0.1
    attention_type: "self"    # 最简单的注意力
    pe_type: "sinusoidal_1d"
    output_head_type: "global"
    target_latency_ms: 10.0

  # === 高质量推理组 (~20ms) ===
  # 追求更好性能，可接受较高延迟
  
  # 标准MLP - 目标20ms
  standard_mlp:
    model_type: mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [512, 512, 256]
    activation: gelu
    dropout: 0.1
    use_batch_norm: true
    target_latency_ms: 20.0
    
  # 标准Transformer - 目标20ms
  standard_transformer:
    model_type: transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 192
    num_heads: 4
    num_layers: 3
    dropout: 0.1
    seq_len: 11
    pe_type: sinusoidal_1d
    target_latency_ms: 20.0
    
  # 增强CustomTransformer - 目标20ms
  enhanced_custom_transformer:
    model_type: custom_transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 64
    num_heads: 4
    num_layers: 2
    dropout: 0.1
    attention_type: "relative"
    pe_type: "learnable_1d"
    output_head_type: "global"
    target_latency_ms: 20.0

# 延迟测量配置
latency_measurement:
  warmup_iterations: 20      # 预热次数
  measurement_iterations: 100 # 测量次数
  include_data_loading: false # 不包含数据加载时间
  measure_memory: true       # 同时测量显存
  
  # 多种batch size测试
  batch_sizes: [1, 4, 8, 16, 32]
  
  # 不同精度测试
  precisions: ["fp32", "fp16"]

# 评估配置
evaluation:
  metrics:
    - mse_loss
    - mae_loss
    - inference_time
    - throughput
    - memory_usage
  
  # 延迟相关指标
  latency_metrics:
    - mean_latency
    - p50_latency
    - p95_latency
    - p99_latency
    - latency_std
    - throughput_samples_per_sec
  
  # 效率指标
  efficiency_metrics:
    - accuracy_per_ms
    - params_per_ms
    - flops_per_ms
    - energy_efficiency  # 如果可测量
  
  # 统计配置
  num_runs: 5
  confidence_interval: 0.95

# 可视化配置
visualization:
  enabled: true
  plots:
    - accuracy_vs_latency
    - latency_distribution
    - throughput_comparison
    - memory_vs_latency
  save_format: ["png", "svg"]

# 输出配置
output:
  results_dir: "./iso_latency_results"
  save_models: false
  save_latency_profiles: true
  generate_deployment_guide: true

# === Iso-Latency 实验设计说明 ===
#
# 1. 核心原则:
#    - 控制推理延迟在相近范围内 (±20%)
#    - 模拟真实部署环境 (单样本推理)
#    - 考虑不同硬件和精度设置
#
# 2. 应用场景分组:
#    - 实时应用 (~5ms): 在线推理、交互式应用
#    - 准实时应用 (~10ms): 批处理、后台服务
#    - 离线应用 (~20ms): 科研分析、高质量重建
#
# 3. 关键假设验证:
#    - "延迟约束下的最优架构选择"
#    - "参数量与推理速度的非线性关系"
#    - "注意力机制的延迟开销分析"
#
# 4. 工程价值:
#    - 直接指导生产环境模型选择
#    - 验证模型优化和量化效果
#    - 支持SLA (Service Level Agreement) 设计
#
# 5. 测量注意事项:
#    - 冷启动 vs 热启动延迟
#    - 不同batch size的延迟特性
#    - GPU利用率与延迟的关系
#    - 内存带宽对延迟的影响
#
# 6. 预期发现:
#    - MLP可能在低延迟场景下更优
#    - Transformer的延迟主要来自注意力计算
#    - 模型并行化对延迟的影响
#    - 混合精度的加速效果