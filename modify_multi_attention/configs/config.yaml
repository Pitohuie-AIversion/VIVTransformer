device: "cuda"

visualization:
  enabled: false        # 打开可视化
  interval: 1          # 每个epoch都保存
  max_samples: 5    # 保存每个epoch下所有batch的可视化
  save_format: "npy"   # 选择保存格式 ("npy" 或 "csv")


  do_svd_visualization: false
  svd_vis_num: 5

