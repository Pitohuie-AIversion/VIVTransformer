# 增强版归一化配置文件
# 展示不同归一化方法的使用

# 数据配置
data:
  data_path: "data/2D_CFD_Rand_M0.1_Eta1e-08_Zeta1e-08_periodic_Train.hdf5"
  batch_size: 32
  num_samples: 100
  num_workers: 0  # Windows兼容性
  
  # 输入输出分辨率
  input_resolution: [32, 32]    # 输入32x32
  output_resolution: [128, 128] # 输出128x128
  
  # 归一化配置
  normalize: true               # 是否启用归一化
  normalize_method: "minmax"    # 归一化方法: "minmax", "zscore", "robust"
  normalize_range: [0, 1]       # Min-Max归一化的目标范围
  
  # 数据预处理
  remove_channel_dim: true      # 移除通道维度

# 模型配置
model:
  type: "mlp"  # 或 "transformer"
  
  # MLP配置
  mlp:
    hidden_dims: [512, 256, 128]
    activation: "relu"
    dropout: 0.1
    batch_norm: true
  
  # Transformer配置  
  transformer:
    d_model: 256
    nhead: 8
    num_layers: 6
    dim_feedforward: 1024
    dropout: 0.1

# 训练配置
training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 1e-5
  scheduler: "cosine"
  
  # 早停配置
  early_stopping:
    patience: 10
    min_delta: 1e-6
  
  # 检查点配置
  checkpoint:
    save_best: true
    save_interval: 10

# 损失函数配置
loss:
  type: "mse"  # 或 "enhanced_svd"
  
  # 增强SVD损失配置
  enhanced_svd:
    mse_weight: 0.7
    svd_weight: 0.3
    rank_penalty: 0.1

# 验证配置
validation:
  metrics: ["mse", "mae", "r2"]
  save_predictions: true
  
# 可视化配置
visualization:
  enabled: true
  save_plots: true
  plot_training_curves: true
  plot_predictions: true

# 输出配置
output:
  model_dir: "models"
  log_dir: "logs"
  result_dir: "results"
  
# 设备配置
device:
  use_cuda: true
  cuda_device: 0

---
# 不同归一化方法的配置示例

# 1. Min-Max归一化到[0,1]范围
minmax_01_config:
  data:
    normalize: true
    normalize_method: "minmax"
    normalize_range: [0, 1]

# 2. Min-Max归一化到[-1,1]范围  
minmax_11_config:
  data:
    normalize: true
    normalize_method: "minmax"
    normalize_range: [-1, 1]

# 3. Z-score标准化
zscore_config:
  data:
    normalize: true
    normalize_method: "zscore"
    # normalize_range参数对zscore无效

# 4. 鲁棒归一化（使用中位数和四分位距）
robust_config:
  data:
    normalize: true
    normalize_method: "robust"
    # normalize_range参数对robust无效

# 5. 不使用归一化
no_normalize_config:
  data:
    normalize: false
    # 其他归一化参数将被忽略