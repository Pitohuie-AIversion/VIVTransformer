#  - "s2"
#  - "crossformer"
#  - "moa"
#  - "dat"
#  - "parnet"
#  - "mobilevit"
#  - "mobilevitv2"

device: "cuda"

visualization:
  enabled: true        # 打开可视化
  interval: 1          # 每个epoch都保存
  max_samples: 9999    # 保存每个epoch下所有batch的可视化
  save_format: "npy"   # 选择保存格式 ("npy" 或 "csv")
