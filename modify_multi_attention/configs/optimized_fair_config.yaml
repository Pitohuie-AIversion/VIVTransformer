# 真正公平的对比配置文件
# 目标: 所有模型参数量控制在500万-1000万参数范围内

# 数据配置
data:
  data_path: "x:/2025/Graduation_project/Pdebench_input_Transformer/VIVTransformer-1/generate_data/preprocessed_data/darcy_flow_input32_output128_dataset.h5"
  input_dim: 1024    # 32x32输入
  output_dim: 16384  # 128x128输出
  crop_mode: "center"
  output_resolution: [128, 128]
  output_channels: 1
  batch_size: 32
  val_split: 0.2
  test_split: 0.1
  max_samples: 1000
  preprocessing:
    normalize: true
    remove_channel_dim: true

# 训练配置
training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  min_delta: 0.0001

# 损失配置
loss:
  mse_only: true
  mse_weight: 1.0
  l1_weight: 0.0
  ssim_weight: 0.0
  perceptual_weight: 0.0
  gradient_weight: 0.0
  frequency_weight: 0.0

# 注意力机制配置
attention:
  type: "self"

# 模型配置 - 真正公平的参数量
models:
  # MLP模型 - 约700万参数
  mlp:
    model_type: mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [1024, 1536]  # 只保留两个隐藏层
    activation: gelu
    dropout: 0.1
    use_batch_norm: true
    use_residual: true

  # Transformer模型 - 约680万参数
  transformer:
    model_type: transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 256
    num_heads: 8
    num_layers: 3
    dropout: 0.1
    seq_len: 11
    pe_type: sinusoidal_1d
    use_memory_film: false
    max_time_steps: 100
    output_head_type: global
    time_encoding: embedding

  # 自定义Transformer模型 - 大幅减少参数
  custom_transformer:
    model_type: custom_transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 64       # 大幅减少到64
    num_heads: 4      # 减少头数
    num_layers: 2     # 减少层数
    dropout: 0.1
    attention_type: "relative"
    seq_len: null
    pe_type: "learnable_1d"
    output_head_type: "global"
    time_encoding: "embedding"
    use_memory_film: false  # 关闭memory film
    use_memory_concat: false
    max_time_steps: 100

  # 简化MLP - 约500万参数
  simple_mlp:
    model_type: mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [1024]  # 只有一个隐藏层
    activation: gelu
    dropout: 0.1
    use_batch_norm: true
    use_residual: false

  # 简化Transformer - 约400万参数
  simple_transformer:
    model_type: transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 192
    num_heads: 6
    num_layers: 2
    dropout: 0.1
    seq_len: 11
    pe_type: sinusoidal_1d
    use_memory_film: false
    max_time_steps: 100
    output_head_type: global
    time_encoding: embedding

# 设备配置
device:
  use_cuda: true
  device_id: 0
  mixed_precision: false

# 可视化配置
visualization:
  enabled: true
  interval: 10
  max_samples: 5

# 输出配置
output:
  results_dir: "./optimized_fair_results"
  save_models: true
  save_predictions: true
  generate_plots: true