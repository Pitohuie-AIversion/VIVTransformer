#  - "aft"
#  - "outlook"
#  - "vip"
#  - "coatnet"
#  - "halo"
#  - "polarized"
#  - "cot"
#  - "residual"
#  - "s2"
#  - "crossformer"
#  - "moa"
#  - "dat"
#  - "parnet"
#  - "mobilevit"
#  - "mobilevitv2"

device: "cuda:0"              # 强烈建议明确指定主卡
use_dataparallel: true        # 新增，双卡/多卡训练控制
seed: 42                      # 新增，训练可重复性
deterministic: true           # 新增，训练可重复性
max_memory_fraction: 0.8      # 新增，每进程最大显存占用比例

visualization:
  enabled: true  # 是否启用可视化
  interval: 100   # 每隔多少个 epoch 画一次图
  max_samples: 5 # 最多可视化多少个样本
