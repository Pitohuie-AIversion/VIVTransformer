model:
  input_dim: 400
  output_dim: 40000
  d_model: 512
  num_heads: 8
  num_layers: 6
  max_time_steps: 100
  attention_type: "relative"  # 这里的默认类型可以随时更改
  seq_len: 49  # 明确指定7x7空间尺寸，支持CNN注意力

attention_types:
#  - "relative"
#  - "sparse"
#  - "lsh"
#  - "se"
#  - "sk"
#  - "cbam"
#  - "bam"
#  - "eca"
#  - "danet"
#  - "psa"
#  - "shuffle"
#  - "muse"
  - "sge"
