# 中参数量配置 - 目标: 5-8M参数
experiment:
  name: 'medium_params_comparison'
  mode: 'multi_model'
  output_dir: 'medium_params_results'
  seed: 42
  deterministic: true
  log_level: 'INFO'
  save_intermediate: false

device:
  use_gpu: true
  gpu_id: 0

data:
  data_type: 'synthetic'
  input_dim: 1024  # seq_len * d_model = 32 * 32 = 1024
  output_dim: 1024
  input_resolution: [32, 32]
  output_resolution: [32, 32]
  output_channels: 1
  crop_mode: 'center'
  normalize: true
  remove_channel_dim: true
  batch_size: 4
  val_split: 0.2
  test_split: 0.1
  max_samples: 100
  num_workers: 0
  pin_memory: false
  shuffle: true

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: 'adam'
  patience: 10
  min_delta: 0.0001

models:
  transformer:
    model_type: 'custom_transformer'
    d_model: 64          # 中型：适中的d_model
    num_heads: 8         # 适中的注意力头数
    num_layers: 6        # 适中的层数
    dropout: 0.1
    attention_type: 'simplified_self'
    seq_len: 32
    pe_type: 'learnable_1d'
    output_head_type: 'global'
    time_encoding: 'embedding'
    use_memory_film: false
    use_memory_concat: false
    max_time_steps: 100

  unet:
    model_type: "unet"
    input_dim: 1024
    output_dim: 1024
    input_spatial_dim: 32
    output_spatial_dim: 32
    channels: [64, 128, 256]  # 中型：适中的通道数
    kernel_size: 3
    stride: 1
    padding: 1
    activation: "relu"
    use_batch_norm: true
    dropout: 0.1

  mlp:
    model_type: "mlp"
    input_dim: 1024
    output_dim: 1024
    hidden_dims: [512, 512, 512]  # 中型：适中的隐藏层
    activation: "relu"
    dropout: 0.1
    use_batch_norm: true
    use_residual: false

  fno:
    model_type: "fno"
    input_dim: 1024
    output_dim: 1024
    input_spatial_dim: 32
    output_spatial_dim: 32
    modes: [12, 12]          # 中型：适中的模式数
    width: 48                # 中型：适中的宽度
    num_layers: 3            # 中型：适中的层数
    activation: "gelu"
    dropout: 0.1

adaptive_resources:
  enable_adaptive: false

visualization:
  enable_plots: true
  save_plots: true
  plot_format: 'png'
  dpi: 100