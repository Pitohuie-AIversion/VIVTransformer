checkpoint:
  mode: min
  monitor: val_loss
  save_best: true
  save_dir: checkpoints
  save_last: true
data:
  batch_size: 1
  crop_mode: center
  input_resolution:
  - 16
  - 16
  num_samples: 3
  output_resolution:
  - 32
  - 32
  path: X:\2025\Graduation_project\Pdebench_input_Transformer\VIVTransformer-1\PDEBench\pdebench\data_download\2D_DarcyFlow_beta0.1_Train.hdf5
  test_ratio: 0.1
  train_ratio: 0.7
  valid_ratio: 0.2
device: cuda
gradient:
  accumulation_steps: 1
  clip_norm: 1.0
logging:
  level: INFO
  log_dir: logs
  save_logs: true
loss:
  base_weight: 0.7
  svd_weights:
  - 0.15
  - 0.1
  - 0.05
  topk: 3
  type: mse_svd
mixed_precision:
  enabled: false
model:
  activation: relu
  attention_type: sge
  d_model: 128
  dim_feedforward: 256
  dropout: 0.1
  input_dim: 256
  max_time_steps: 50
  normalization:
    eps: 1e-6
    type: layer_norm
  num_heads: 4
  num_layers: 2
  output_dim: 1024
  positional_encoding:
    max_len: 5000
    type: sinusoidal
  seq_len: 256
  weight_init:
    gain: 1.0
    method: xavier_uniform
    std: 0.02
optimizer:
  amsgrad: false
  betas:
  - 0.9
  - 0.999
  eps: 1e-8
  lr: 0.001
  type: adamw
  weight_decay: 0.001
output:
  save_dir: results
  save_metrics: true
  save_predictions: true
scheduler:
  T_max: 10
  enabled: true
  eta_min: 1e-6
  type: cosine
training:
  epochs: 1
  learning_rate: 0.001
  model_save_path: models/gpu_test_model.pth
  patience: 5
  weight_decay: 0.0001
visualization:
  enabled: true
  interval: 1
  max_samples: 5
  plot_dir: plots
  save_plots: true
  show_plots: false
