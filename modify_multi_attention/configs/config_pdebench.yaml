# PDEBench数据集配置示例
data:
  path: "x:/2025/Graduation_project/Pdebench_input_Transformer/VIVTransformer-1/PDEBench/pdebench/data_download/2D_DarcyFlow_beta0.1_Train.hdf5"
  batch_size: 32
  dataset_type: "pdebench"  # 明确指定使用PDEBench数据集
  max_samples: 1000  # 限制样本数量以加快训练

training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 1e-4
  patience: 10
  min_delta: 1e-6
  save_best_model: true
  model_save_path: "./models/best_model_pdebench.pth"
  log_interval: 10

model:
  input_dim: 16384  # PDEBench数据展平后的维度 (128*128)
  hidden_dim: 512
  output_dim: 16384  # 与输入维度相同
  num_layers: 4
  dropout: 0.1

attention:
  types: ["sge", "cbam", "eca", "se", "ca", "sa", "psa", "simam", "gam", "triplet"]
  
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/training_pdebench.log"

device: "cuda"
seed: 42