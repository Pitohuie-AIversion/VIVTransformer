# 超公平对比配置文件 - 包含所有模型
# 目标: 所有模型参数量控制在500万左右 (差异<2x)
# 基于详细参数量分析的最优配置

# 数据配置
data:
  data_path: "x:/2025/Graduation_project/Pdebench_input_Transformer/VIVTransformer-1/generate_data/preprocessed_data/darcy_flow_input32_output128_dataset.h5"
  input_dim: 1024    # 32x32输入
  output_dim: 16384  # 128x128输出
  crop_mode: "center"
  output_resolution: [128, 128]
  output_channels: 1
  batch_size: 32
  val_split: 0.2
  test_split: 0.1
  max_samples: 1000
  preprocessing:
    normalize: true
    remove_channel_dim: true

# 训练配置
training:
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 10
  min_delta: 0.0001

# 损失配置
loss:
  mse_only: true
  mse_weight: 1.0
  l1_weight: 0.0
  ssim_weight: 0.0
  perceptual_weight: 0.0
  gradient_weight: 0.0
  frequency_weight: 0.0

# 注意力机制配置
attention:
  type: "self"

# 模型配置 - 超公平参数量 (约500万参数)
models:
  # MLP模型 - 约513万参数
  mlp:
    model_type: mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [512, 512, 256]  # 优化后的配置
    activation: gelu
    dropout: 0.1
    use_batch_norm: true
    use_residual: false

  # Transformer模型 - 约514万参数
  transformer:
    model_type: transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 192      # 优化后的配置
    num_heads: 2
    num_layers: 4
    dropout: 0.1
    seq_len: 11
    pe_type: sinusoidal_1d
    use_memory_film: false
    max_time_steps: 100
    output_head_type: global
    time_encoding: embedding

  # 自定义Transformer模型 - 约500万参数 (超极简配置)
  custom_transformer:
    model_type: custom_transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 8        # 超极简配置
    num_heads: 1      # 减少到1个头
    num_layers: 1
    dropout: 0.1
    attention_type: "relative"
    seq_len: null
    pe_type: "learnable_1d"
    output_head_type: "global"
    time_encoding: "embedding"
    use_memory_film: false
    use_memory_concat: false
    max_time_steps: 100

  # 简化MLP模型 - 约400万参数
  simple_mlp:
    model_type: simple_mlp
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [256, 256]  # 更简单的配置
    activation: relu
    dropout: 0.1
    use_batch_norm: false
    use_residual: false

  # 简化Transformer模型 - 约300万参数
  simple_transformer:
    model_type: simple_transformer
    input_dim: 1024
    output_dim: 16384
    d_model: 128      # 简化配置
    num_heads: 2
    num_layers: 2
    dropout: 0.1
    seq_len: 11
    pe_type: sinusoidal_1d
    use_memory_film: false
    max_time_steps: 100
    output_head_type: global
    time_encoding: embedding

# 设备配置
device:
  use_cuda: true
  device_id: 0
  mixed_precision: false

# 可视化配置
visualization:
  enabled: true
  interval: 10
  max_samples: 5

# 输出配置
output:
  results_dir: "./ultra_fair_results"
  save_models: true
  save_predictions: true
  generate_plots: true

# 注释说明:
# 由于FNO和UNet模型的参数量主要来自输入输出维度映射层(1024→16384)
# 即使最小配置也需要约5000万参数，远超其他模型
# 为保证公平对比，本配置专注于参数量相近的模型:
# - MLP系列: 300万-500万参数
# - Transformer系列: 300万-500万参数
# - CustomTransformer: 约500万参数
# 
# 如需包含FNO和UNet，建议:
# 1. 降低输入输出分辨率 (如16x16→64x64)
# 2. 使用分层对比策略
# 3. 重点关注计算效率而非参数量