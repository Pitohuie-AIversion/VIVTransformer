# CPU测试配置文件
# 用于避免CUDA设备问题的全模型测试

# 实验配置
experiment:
  name: "cpu_all_models_test"
  mode: "multi_model_comparison"
  output_dir: "cpu_test_results"
  seed: 42
  deterministic: true
  log_level: "INFO"
  save_intermediate: true

# 数据配置
data:
  # 数据路径和基本设置
  data_path: "X:/2025/Graduation_project/report/data/pdebench/2D/DarcyFlow/2D_DarcyFlow_beta0.01_Train.hdf5"
  input_dim: 1024      # 32x32输入
  output_dim: 16384    # 128x128输出
  
  # 分辨率设置
  input_resolution: [32, 32]
  output_resolution: [128, 128]
  output_channels: 1
  
  # 数据处理
  crop_mode: "center"
  normalize: true
  remove_channel_dim: true
  
  # 数据集分割 - 快速测试模式
  batch_size: 2
  val_split: 0.2
  test_split: 0.1
  max_samples: 50  # 适中的样本数
  
  # 数据加载器
  num_workers: 0  # Windows兼容性
  pin_memory: false
  shuffle: true

# 训练配置
training:
  epochs: 3  # 快速测试
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "adamw"
  
  # 学习率调度
  scheduler: "cosine"
  warmup_epochs: 0
  
  # 早停配置
  early_stopping:
    patience: 2
    min_delta: 0.001
  
  # 检查点配置
  checkpoint:
    save_best: true
    save_interval: 1
    save_last: true
  
  # 设备配置 - 强制使用CPU
  device: "cpu"
  mixed_precision: false
  use_dataparallel: false

# 损失函数配置
loss:
  # 基础损失
  mse_weight: 1.0
  l1_weight: 0.0
  
  # 高级损失
  ssim_weight: 0.0
  perceptual_weight: 0.0
  gradient_weight: 0.0
  frequency_weight: 0.0
  
  # SVD损失配置
  svd_loss:
    enabled: false
    base_weight: 0.7
    svd_weights: [0.1, 0.1, 0.05, 0.03, 0.02]
    topk: 5

# 模型配置
models:
  # 当前激活的模型
  active_model: "transformer"
  
  # Transformer配置
  transformer:
    model_type: "transformer"
    input_dim: 1024
    output_dim: 16384
    d_model: 32  # 小模型用于CPU测试
    num_heads: 2
    num_layers: 2
    dropout: 0.1
    seq_len: 11
    pe_type: "sinusoidal_1d"
    use_memory_film: false
    max_time_steps: 100
    output_head_type: "global"
    time_encoding: "embedding"
  
  # Enhanced Transformer配置
  enhanced_transformer:
    model_type: "enhanced_transformer"
    input_dim: 1024
    output_dim: 16384
    d_model: 32
    num_heads: 2
    num_layers: 2
    dropout: 0.1
    seq_len: 11
    pe_type: "sinusoidal_1d"
    use_memory_film: true
    max_time_steps: 100
    output_head_type: "global"
    time_encoding: "embedding"
  
  # MLP配置
  mlp:
    model_type: "mlp"
    input_dim: 1024
    output_dim: 16384
    hidden_dims: [256, 128]
    activation: "relu"
    dropout: 0.1
    use_batch_norm: true
    use_residual: false
  
  # UNet配置
  unet:
    model_type: "unet"
    input_dim: 1024
    output_dim: 16384
    base_channels: 16  # 小模型用于CPU测试
    num_levels: 2
    dropout: 0.1
  
  # FNO配置
  fno:
    model_type: "fno"
    input_dim: 1024
    output_dim: 16384
    modes: 4  # 小模型用于CPU测试
    width: 16
    num_layers: 2
    dropout: 0.1

# 注意力机制配置
attention:
  type: "self"
  
  # 多注意力对比模式
  comparison_types: ["self"]

# 评估配置
evaluation:
  # 评估指标
  metrics: ["mse", "mae", "r2"]
  
  # 可视化配置
  visualization:
    enabled: true
    interval: 1
    max_samples: 3
    save_plots: true
    plot_types: ["prediction", "loss_curve"]

# 对比实验配置
comparison:
  # 参数量公平对比
  parameter_fair:
    enabled: false
    target_params: 100000
    tolerance: 2.0
  
  # 多模型对比
  multi_model:
    enabled: true
    models: ["transformer", "enhanced_transformer", "mlp", "unet", "fno"]
    generate_report: true
    generate_plots: true
  
  # 损失函数对比
  loss_comparison:
    enabled: false

# 系统资源配置
system:
  # 自适应资源管理
  adaptive_resources: true
  
  # 内存管理
  memory_management:
    auto_cleanup: true
    cleanup_interval: 10
    max_memory_usage: 0.6  # CPU模式下降低内存使用
  
  # 批次大小自适应
  adaptive_batch_size:
    enabled: true
    initial_batch_size: 2
    max_batch_size: 4  # CPU模式下限制批次大小
    min_batch_size: 1

# 预设配置
presets:
  quick_test:
    data:
      max_samples: 20
      batch_size: 1
    training:
      epochs: 2
    comparison:
      multi_model:
        models: ["mlp", "transformer"]
  
  full_test:
    data:
      max_samples: 100
      batch_size: 2
    training:
      epochs: 5
    comparison:
      multi_model:
        models: ["transformer", "enhanced_transformer", "mlp", "unet", "fno"]
  
  all_models_test:
    comparison:
      multi_model:
        enabled: true
        models: ["transformer", "enhanced_transformer", "mlp", "unet", "fno"]
        generate_report: true
        generate_plots: true